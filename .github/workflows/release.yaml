name: 🚀 Release Action

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Run in dry-run mode"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🧑‍💻 Set Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: ⚙️ Install PNPM
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Preview release (dry run)
        if: ${{ inputs.dryRun }}
        run: pnpm nx release --dry-run

      - name: 🚀 Run release
        if: ${{ !inputs.dryRun }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(node -p "require('./package.json').version")
          pnpm nx release --skip-publish
          AFTER=$(node -p "require('./package.json').version")

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "No version bump; skipping major tag"
            exit 0
          fi

          MAJOR="v${AFTER%%.*}"
          git tag -fa "$MAJOR" -m "Update $MAJOR to v${AFTER}"
          git push origin "refs/tags/$MAJOR" --force
