name: 🚀 Release Action

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Run in dry-run mode"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧑‍💻 Set Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: ⚙️ Install PNPM
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: 🔑 Configure .npmrc for GitHub Packages
        if: ${{ inputs.configure-npmrc == 'true' }}
        shell: bash
        run: |
          pnpm config set "//npm.pkg.github.com/:_authToken" "${GITHUB_TOKEN}" --location project
          pnpm config set "@${GITHUB_REPOSITORY_OWNER}:registry" "https://npm.pkg.github.com" --location project
        env:
          GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Preview release (dry run)
        if: ${{ inputs.dry-run == 'true' }}
        run: npx nx release --dry-run

      - name: 🚀 Run release
        if: ${{ inputs.dryRun == 'false' }}
        id: release
        run: pnpm nx release --skip-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Move rolling major tag
        if: ${{ inputs.dry-run == 'false' }}
        run: |
          VERSION=$(pnpm pkg get version)
          MAJOR="v$(echo ${VERSION} | cut -d. -f1)"
          git tag -fa "$MAJOR" -m "Update $MAJOR to v${VERSION}"
          git push origin "$MAJOR" --force
